repo_id: bartowski/Llama-3.2-1B-Instruct-GGUF
model_dir: models/llama32-1b

quants:
  - Llama-3.2-1B-Instruct-Q4_K_M.gguf
  - Llama-3.2-1B-Instruct-Q6_K.gguf
  - Llama-3.2-1B-Instruct-Q8_0.gguf

llama_bench_bin: llama-bench

time_bin: /usr/bin/time
time_args:
  - -l

threads: 8
repetitions: 1
n_gen: 128

devices:
  - name: MTL0
    ngl: 80

prompt_tokens:
  - 512
  - 1920

results_dir: results
raw_logs_dir: results/raw_logs
plots_dir: results/plots
runs_csv: results/runs.csv
recommendation_out: results/recommendation.json

prefer_hf_cli: true