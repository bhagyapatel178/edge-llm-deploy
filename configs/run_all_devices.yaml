repo_id: Qwen/Qwen2.5-3B-Instruct-GGUF
model_dir: models/qwen2.5-3b

quants:
  - qwen2.5-3b-instruct-q3_k_m.gguf
  - qwen2.5-3b-instruct-q4_k_m.gguf
  - qwen2.5-3b-instruct-q6_k.gguf
  - qwen2.5-3b-instruct-q8_0.gguf

llama_bench_bin: llama-bench

# macOS default
time_bin: /usr/bin/time
time_args:
  - -l

threads: 8
repetitions: 1
n_gen: 128

devices:
  - name: MTL0
    ngl: 80
  - name: BLAS
    ngl: 0

prompt_tokens:
  - 512
  - 1920
  - 3968
  - 8064

results_dir: results
raw_logs_dir: results/raw_logs
plots_dir: results/plots
runs_csv: results/runs.csv
recommendation_out: results/recommendation.json

prefer_hf_cli: true